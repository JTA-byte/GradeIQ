name: Refresh Buy Signals cache

on:
  schedule:
    - cron: "0 2 * * *" # 2am UTC daily
  workflow_dispatch: {} # allows manual triggering from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The underlying computation (app/api/internal/refresh-buy-signals-cache)
    # has taken up to ~21 minutes against the live, not-yet-deduplicated
    # market_sales table -- see supabase/deduplicate_market_sales.py.
    # Generous on purpose; lower once that cleanup is done and the
    # computation is reliably fast.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: python-services
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh Buy Signals cache
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          GRADEIQ_APP_URL: ${{ vars.GRADEIQ_APP_URL || 'https://gradeiq.net' }}
        run: python -m jobs.compute_buy_signals
